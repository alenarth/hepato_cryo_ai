<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HepatoCryoAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: inherit; font-weight: 600; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
        .page-title { color: #0d6efd !important; font-weight: 700; letter-spacing: -.02em; font-size: 2.75rem; line-height: 1.05; }
        .section-title { color: #0d6efd !important; font-weight: 600; }
        .card-heading { color: #212529 !important; font-weight: 600; }
        .content-card { box-shadow: 0 .125rem .25rem rgba(0, 0, 0, .08) !important; border: 1px solid rgba(0, 0, 0, .08) !important; }
        .content-card .card-body { padding: 1.5rem; }
        .content-box { background-color: #ffffff; border: 1px solid #dee2e6; border-radius: .75rem; box-shadow: 0 .15rem .3rem rgba(0, 0, 0, .04); }
        .footer { margin-top: 50px; padding: 20px 0; background-color: #e9ecef; text-align: center; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">HepatoCryoAI</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Home & Info</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/application">AI Simulator</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/lab-data">Laboratory Data</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
    {% block content %}{% endblock %}
</div>

<footer class="footer">
    <div class="container text-muted">
        <small>FIOCRUZ Scientific Project - HepatoCryoAI © 2026. Research tool only.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
